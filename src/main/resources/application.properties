# 测试/本地随机端口；需要固定端口时改为 8080
server.port=0

# 指标采集总开关：关闭期间不产生任何接口指标，重新开启后继续累加（不做隐式重置）
observability.metrics-enabled=true
# 详细指标（耗时分布/成败计数）采样率，取值 [0,1]；observedTotal 始终全量计数
observability.sampling-rate=1.0

# 日志格式：MDC 中的 traceId 贯穿同一次请求的所有日志，无链路时显示 "-"
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:--}] %logger{36} - %msg%n
